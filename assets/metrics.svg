<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="6+ years · 100K+ users · 20+ projects delivered · 5 countries served">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/><stop offset="1" stop-color="#150d2e"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .n { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
      .l { font-size: 15px; fill: #94a3b8; font-weight: 600; }
      .s { animation: sweep 6s ease-in-out infinite; }
      .d2 { animation-delay: 1.5s; } .d3 { animation-delay: 3s; } .d4 { animation-delay: 4.5s; }
      @keyframes sweep { 0% { transform: translateX(-300px); } 40%, 100% { transform: translateX(300px); } }
    </style>
    <clipPath id="c1"><rect width="282" height="130" rx="18"/></clipPath>
  </defs>
  <g transform="translate(0 10)">
    <g><g class="in">
      <rect width="282" height="130" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
      <g clip-path="url(#c1)"><rect class="s" x="-100" width="200" height="130" fill="url(#shine)"/></g>
      <text class="t n" x="28" y="68" fill="url(#num)">6+</text>
      <text class="t l" x="28" y="100">years shipping software</text>
    </g></g>
    <g transform="translate(306 0)"><g class="in i2">
      <rect width="282" height="130" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
      <g clip-path="url(#c1)"><rect class="s d2" x="-100" width="200" height="130" fill="url(#shine)"/></g>
      <text class="t n" x="28" y="68" fill="url(#num)">100K+</text>
      <text class="t l" x="28" y="100">users served by apps I built</text>
    </g></g>
    <g transform="translate(612 0)"><g class="in i3">
      <rect width="282" height="130" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
      <g clip-path="url(#c1)"><rect class="s d3" x="-100" width="200" height="130" fill="url(#shine)"/></g>
      <text class="t n" x="28" y="68" fill="url(#num)">20+</text>
      <text class="t l" x="28" y="100">projects delivered</text>
    </g></g>
    <g transform="translate(918 0)"><g class="in i4">
      <rect width="282" height="130" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
      <g clip-path="url(#c1)"><rect class="s d4" x="-100" width="200" height="130" fill="url(#shine)"/></g>
      <text class="t n" x="28" y="68" fill="url(#num)">5</text>
      <text class="t l" x="28" y="100">countries served</text>
    </g></g>
  </g>
</svg>
